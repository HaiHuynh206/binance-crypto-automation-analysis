x-airflow-common: &airflow-common
  build:
    context: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__EXPOSE_STACKTRACE: "false"
    # Trust X-Forwarded-* headers when the UI is behind a tunnel/reverse proxy.
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    CRYPTO_DATA_ROOT: /opt/airflow/data
    CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT}
    CRYPTO_DATASETS: ${CRYPTO_DATASETS:-klines_1s,klines_1m,agg_trades,funding_rate,open_interest}
    CRYPTO_WEIGHT_PER_MINUTE: ${CRYPTO_WEIGHT_PER_MINUTE:-2400}
    CRYPTO_LOOKBACK_HOURS: ${CRYPTO_LOOKBACK_HOURS:-24}
    CRYPTO_DQ_FAIL_ON: ${CRYPTO_DQ_FAIL_ON:-missing}
    CRYPTO_MEDALLION_ENABLED: ${CRYPTO_MEDALLION_ENABLED:-1}
    # S3-compatible publishing (R2/S3/MinIO). Empty bucket disables the task.
    CRYPTO_S3_BUCKET: ${CRYPTO_S3_BUCKET:-}
    CRYPTO_S3_PREFIX: ${CRYPTO_S3_PREFIX:-crypto}
    CRYPTO_S3_ENDPOINT_URL: ${CRYPTO_S3_ENDPOINT_URL:-}
    CRYPTO_S3_REGION: ${CRYPTO_S3_REGION:-auto}
    CRYPTO_S3_ACL: ${CRYPTO_S3_ACL:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/data
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEB_BIND:-0.0.0.0}:${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-db-volume:
  airflow-logs:
