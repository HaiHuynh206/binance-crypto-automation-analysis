[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ingest"
version = "0.1.0"
description = "High-frequency crypto market data ingestion into a partitioned Parquet lake"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pyarrow>=15",
    "duckdb>=1.0",
    # DuckDB needs pytz to materialise TIMESTAMP WITH TIME ZONE values in Python.
    "pytz>=2024.1",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
crypto-ingest = "crypto_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
